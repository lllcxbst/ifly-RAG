name: product-support-bot

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-support_bot}
      POSTGRES_USER: ${POSTGRES_USER:-support_bot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - support_bot_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-support_bot} -d ${POSTGRES_DB:-support_bot}"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [support_bot_net]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - support_bot_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [support_bot_net]

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - support_bot_uploads:/app/uploads
      - support_bot_graph:/app/graph_store
    ports:
      - "127.0.0.1:${APP_PORT:-8088}:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/v1/health')"]
      interval: 15s
      timeout: 5s
      retries: 8
    networks:
      support_bot_net:
      edge_proxy_net:
        aliases: [support-bot-app]

volumes:
  support_bot_pgdata:
  support_bot_redis:
  support_bot_uploads:
  support_bot_graph:

networks:
  support_bot_net:
    name: support_bot_net
  edge_proxy_net:
    external: true
    name: personal-kb_default
